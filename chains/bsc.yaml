  sim_timeout_ms: 1200
  sim_fallback_budget_ms: 95
  gas_refresh_blocks: 20
  cache_save_blocks: 40
  bundle_span_blocks: 6
  passive_bundle_span_blocks: 10
  backrun_span_blocks: 3
  wait_receipt_ms: 2200
  bundle_grace_ms: 10
  bundle_http_timeout_ms: 650

